    <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ICSS Admin — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/css/global-theme.css">
    <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" type="image/png" href="./favicon.png">
</head>
<body class="login-page">



    <div class="login-card">
        <a class="login-back" href="/">← Back to ICSS Bookings</a>
        <div class="login-logo">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 1rem;">
                <img src="./favicon.png" alt="ICSS Icon" style="width: 56px; height: 56px; border-radius: 12px; object-fit: contain;">
                <div style="display: flex; flex-direction: column; align-items: center;">
                    <span style="font-family: 'Clash Display', sans-serif; font-weight: 700; font-size: 2rem; background: linear-gradient(135deg, var(--primary), var(--primary-dim)); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1;">ICSS</span>
                    <span style="font-size: 0.65rem; letter-spacing: 2px; color: var(--text-dim); font-weight: 600; line-height: 1; margin-top: 4px;">BOOKING MANAGEMENT</span>
                </div>
            </div>
            <h1 class="login-title">Welcome back</h1>
            <p class="login-subtitle">Sign in to manage your business and bookings.</p>
        </div>

        <form class="login-form" id="loginForm">
            <div class="login-notice hidden" id="loginNotice"></div>
            <div class="form-group">
                <label for="loginSlug">Business Handle <span style="font-size: 11px; color: var(--text-dim); font-weight: normal;">(Optional)</span></label>
                <input type="text" id="loginSlug" placeholder="e.g. icreate-solutions" autocomplete="organization">
                <div style="font-size: 11px; color: var(--text-dim); margin-top: 4px;">Leave blank if you only manage one business.</div>
            </div>
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" placeholder="admin@icreate.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" required>
                <div style="text-align: right; margin-top: 8px;">
                    <a href="/forgot-password" style="color: #6d28d9; font-size: 13px; text-decoration: none;">Forgot Password?</a>
                </div>
            </div>
            <div class="form-group login-remember" style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px;">
                <input type="checkbox" id="rememberMe" style="width: auto; margin: 0;">
                <label for="rememberMe" style="margin: 0; font-weight: normal; color: var(--text-dim); font-size: 14px; cursor: pointer;">Keep me signed in</label>
            </div>
            <div class="login-error" id="loginError" role="alert"></div>
            <button type="submit" class="login-submit" id="loginBtn">Sign In</button>
        </form>
        <p class="login-footer">New to ICSS Bookings? <a href="/onboarding">Start your free trial</a><br /><a href="https://wa.me/18765857469">Need help? Chat with us</a></p>
    </div>

    <script src="js/admin.js"></script>
    <script>
        // If already logged in, redirect to dashboard
        if (getToken()) window.location.href = 'index.html';

        (function hydrateProvisioningHint() {
            const params = new URLSearchParams(window.location.search);
            const fresh  = params.get('fresh');
            let hint = null;

            try {
                const raw = localStorage.getItem('icss_login_hint');
                hint = raw ? JSON.parse(raw) : null;
            } catch (_) {
                hint = null;
            }

            if (!hint) return;

            if (hint.email) {
                document.getElementById('loginEmail').value = hint.email;
            }
            if (hint.tenantSlug) {
                document.getElementById('loginSlug').value = hint.tenantSlug;
            }

            if (fresh === '1') {
                const notice = document.getElementById('loginNotice');
                notice.textContent = 'Your platform is ready. Sign in to continue to your dashboard.';
                notice.classList.remove('hidden');
            }

            localStorage.removeItem('icss_login_hint');
        })();

        async function handleLogin(e) {
            e.preventDefault();
            const btn        = document.getElementById('loginBtn');
            const errEl      = document.getElementById('loginError');
            const email      = document.getElementById('loginEmail').value.trim();
            const password   = document.getElementById('loginPassword').value;
            const slugEl     = document.getElementById('loginSlug');
            const slug       = slugEl.value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;

            errEl.textContent = '';
            slugEl.style.borderColor = ''; // reset border
            btn.textContent   = 'Signing in...';
            btn.disabled      = true;

            try {
                const data = await apiFetch('/api/v1/auth/login', {
                    method:  'POST',
                    body:    JSON.stringify({ email, password, tenantSlug: slug, rememberMe })
                });
                setAuth(data.token, data.user);
                if (['platform_owner', 'super_admin', 'developer_admin'].includes(data.user.role)) {
                    window.location.href = 'tenants.html';
                } else {
                    window.location.href = 'index.html';
                }
            } catch (err) {
                if (err.requiresHandle) {
                    slugEl.style.borderColor = 'var(--danger)';
                    slugEl.focus();
                }
                errEl.textContent = err.message || 'Login failed. Check your credentials.';
                btn.textContent   = 'Sign In';
                btn.disabled      = false;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', handleLogin);
    </script>
</body>
</html>
